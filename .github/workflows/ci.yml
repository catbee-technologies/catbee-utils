name: CI
run-name: CI for ${{ github.repository }} on ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
      - edited
    branches: 
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Lint, Test, Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application and start
        run: npm run build:start

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Check outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          OUTDATED=$(npm outdated --json || true)

          if [ -n "$OUTDATED" ] && [ "$OUTDATED" != "{}" ]; then
            echo "Outdated dependencies detected:"
            echo "$OUTDATED"
          else
            echo "All dependencies are up to date."
          fi
