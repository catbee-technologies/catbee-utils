# 📦 Publish to npm when pushing to main or tagging a release

name: 📦 Auto Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'       # stable tags like v1.2.3
      - 'v*.*.*-*'     # prerelease tags like v1.2.3-rc.1, v1.2.3-beta.0
  workflow_dispatch:

jobs:
  build:
    name: 📦 Build & Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run lint
        run: npm run lint

      - name: 🔡 Type check
        run: npx tsc --noEmit

      - name: 🧪 Run tests
        run: npm run test

      - name: 🛠️ Build package
        run: npm run compile

      - name: 📝 Remove some fields from package.json
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          delete pkg.devDependencies;
          delete pkg.scripts;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('Removed devDependencies and scripts for publish');
          "

      - name: 🚀 Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v} # strip "v" prefix
          echo "Publishing version $VERSION"

          if [[ "$VERSION" == *-* ]]; then
            # It's a prerelease (contains "-rc", "-beta", etc.)
            TAG=$(echo $VERSION | sed 's/^[0-9.]*-//' | cut -d. -f1)
            echo "Detected prerelease, using dist-tag=$TAG"
            npm publish --access public --tag "$TAG"
          else
            # Stable release
            echo "Detected stable release, using dist-tag=latest"
            npm publish --access public --tag latest
          fi
